<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="calculator-card">
        <h1 class="calculator-title">Калькулятор</h1>
        
        <div class="input-container">
            <div class="field-wrapper">
                <label for="num1">Первое число</label>
                <input type="text" id="num1" placeholder="Введите число..." autocomplete="off">
            </div>
            <div class="field-wrapper">
                <label for="num2">Второе число</label>
                <input type="text" id="num2" placeholder="Введите число..." autocomplete="off">
            </div>
        </div>

        <div class="buttons-grid">
            <button type="button" id="btn-sum" class="calc-btn">Сумма</button>
            <button type="button" id="btn-sub" class="calc-btn">Разность</button>
            <button type="button" id="btn-mul" class="calc-btn">Произведение</button>
            <button type="button" id="btn-div" class="calc-btn">Деление</button>
        </div>

        <div class="result-section">
            <span class="result-title">Результат:</span>
            <div id="result-display" class="result-box empty">—</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
